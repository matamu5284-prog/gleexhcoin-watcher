name: GleexhCoin UBIK Watcher

on:
  schedule:
    # The job itself loops internally for ~55min polling every 15s (see watch.mjs) — this
    # cron just restarts it before GitHub's ~6h job runtime cap. Offset off :00 to avoid
    # GitHub's own top-of-hour scheduling congestion.
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gleexhcoin-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git identity
        run: |
          git config user.name "gleexhcoin-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run fast-loop watcher (polls ~every 15s, plus instant on-chain swap triggers)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: node watch.mjs

      - name: Safety-net commit (in case the loop's own flush missed anything)
        if: always()
        run: |
          git add state.json history.jsonl paperTrades.jsonl
          git diff --cached --quiet || git commit -m "state + history update (safety net) [skip ci]"
          git pull --rebase --autostash origin main || true
          git push || true
